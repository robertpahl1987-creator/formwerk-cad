# Prüft auf allen Branches außer main: Selbsttest (echte Geometrie) + Typecheck + Build
name: Selbsttest
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run selftest
      - run: npm run build
      - name: tmp dist branch
        run: |
          cd dist && git init -q && git checkout -q -b preview-dist && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm dist
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-dist
