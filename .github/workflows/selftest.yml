# Prüft auf allen Branches außer main: Selbsttest (echte Geometrie) + Typecheck + Build
name: Selbsttest
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run selftest
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
