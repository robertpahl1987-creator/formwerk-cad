# Baut die Android-App (APK) und stellt sie unter Releases → "app" bereit.
# Web-Änderungen brauchen KEINE neue APK: Die App lädt immer die aktuelle Version
# von GitHub Pages (automatische Updates). Eine neue APK entsteht nur, wenn sich
# der native Teil ändert (Pfade unten) oder per Hand über "Run workflow".
name: Android-App (APK)
on:
  push:
    branches: [main]
    paths:
      - capacitor.config.json
      - package.json
      - assets/**
      - android-signing/**
      - public/offline.html
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - name: Android-Projekt erzeugen
        run: npx cap add android
      - name: App-Symbol & Startbildschirm
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#0d1117' --iconBackgroundColorDark '#0d1117'
          --splashBackgroundColor '#0d1117' --splashBackgroundColorDark '#0d1117'
          || echo "::warning::Symbole konnten nicht erzeugt werden – Standardsymbol wird verwendet"
      - run: npx cap sync android
      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: APK bauen
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK signieren
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore; KS=release.keystore; PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
          else
            KS=android-signing/formwerk-debug.keystore; PASS=android; ALIAS=formwerk
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" --out formwerk-cad.apk aligned.apk
          "$BT/apksigner" verify --print-certs formwerk-cad.apk | head -3
          ls -la formwerk-cad.apk
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app formwerk-cad.apk \
            --title "Formwerk CAD – Android (Build ${{ github.run_number }})" \
            --latest \
            --notes "versionCode: ${{ github.run_number }}

          **Installieren:** formwerk-cad.apk auf dem Android-Handy öffnen und einmalig „Installation aus unbekannten Quellen“ erlauben.

          **Updates:** Die App lädt neue Funktionen automatisch beim Start. Nur wenn diese APK neu erscheint, zeigt die App einen Hinweis zum Aktualisieren an."
