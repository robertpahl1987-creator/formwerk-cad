<!doctype html>
<html lang="de">
  <head>

    <title>Formwerk CAD – offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 340px; }
      h1 { color: #fff; font-size: 20px; margin: 16px 0 8px; }

  </head>
  <body>
    <div class="card">
      <svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 4 58 18v28L32 60 6 46V18Z" fill="#00ae42"/><path d="M32 4 58 18 32 32 6 18Z" fill="#3ddc84"/><path d="M32 32v28L6 46V18Z" fill="#008f36"/></svg>

      <p>Beim ersten Start lädt Formwerk CAD die aktuelle Version einmal aus dem Internet. Danach funktioniert die App auch offline.</p>
      <button onclick="location.href='https://robertpahl1987-creator.github.io/formwerk-cad/'">Erneut versuchen</button>
